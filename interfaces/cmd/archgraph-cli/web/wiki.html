<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchGraph Code Wiki</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <style>
        :root {
            --wiki-bg: #0f1117;
            --wiki-panel: #171a23;
            --wiki-border: #262b38;
            --wiki-text: #d7dbe6;
            --wiki-muted: #8a93a6;
            --wiki-accent: #7c9cff;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; background: var(--wiki-bg); color: var(--wiki-text);
            font-family: 'Outfit', system-ui, sans-serif; height: 100vh; overflow: hidden;
        }
        .wiki-shell { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
        .wiki-toc {
            background: var(--wiki-panel); border-right: 1px solid var(--wiki-border);
            overflow-y: auto; padding: 20px 16px;
        }
        .wiki-brand { font-weight: 800; font-size: 18px; letter-spacing: -0.4px; margin-bottom: 4px; }
        .wiki-brand span { color: var(--wiki-accent); }
        .wiki-ns { color: var(--wiki-muted); font-size: 12px; font-family: 'JetBrains Mono', monospace; margin-bottom: 18px; }
        .toc-item {
            padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px;
            border: 1px solid transparent; transition: background .15s, border-color .15s;
        }
        .toc-item:hover { background: #1d2230; }
        .toc-item.active { background: #1d2433; border-color: var(--wiki-accent); }
        .toc-title { font-weight: 600; font-size: 14px; }
        .toc-summary { color: var(--wiki-muted); font-size: 12px; margin-top: 3px; line-height: 1.35; }
        .wiki-content { overflow-y: auto; padding: 36px 48px; max-width: 920px; }
        .wiki-content h1 { font-size: 30px; letter-spacing: -0.6px; margin: 0 0 6px; }
        .wiki-content h2 { font-size: 21px; margin-top: 34px; border-bottom: 1px solid var(--wiki-border); padding-bottom: 8px; }
        .wiki-content h3 { font-size: 16px; margin-top: 24px; }
        .wiki-content p, .wiki-content li { line-height: 1.65; color: var(--wiki-text); }
        .wiki-content code { font-family: 'JetBrains Mono', monospace; background: #1d2230; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
        .wiki-content pre { background: #11141c; border: 1px solid var(--wiki-border); border-radius: 10px; padding: 14px; overflow-x: auto; }
        .wiki-content pre code { background: none; padding: 0; }
        a.codelink { color: var(--wiki-accent); text-decoration: none; border-bottom: 1px dashed rgba(124,156,255,.5); }
        a.codelink:hover { border-bottom-style: solid; }
        a.codelink::before { content: "\2197 "; font-size: 11px; opacity: .7; }
        .page-summary { color: var(--wiki-muted); font-size: 15px; margin: 0 0 18px; font-style: italic; }
        .page-meta { color: var(--wiki-muted); font-size: 12px; font-family: 'JetBrains Mono', monospace; margin-bottom: 24px; }
        .badge { display: inline-block; background: #1d2433; border: 1px solid var(--wiki-border); border-radius: 20px; padding: 2px 10px; margin-right: 6px; }
        .mermaid { background: #11141c; border: 1px solid var(--wiki-border); border-radius: 10px; padding: 16px; text-align: center; }
        .placeholder { color: var(--wiki-muted); margin-top: 80px; text-align: center; }
        .spinner { color: var(--wiki-accent); }
        .src-modal {
            position: fixed; inset: 0; background: rgba(5,7,12,.78); display: none;
            align-items: center; justify-content: center; z-index: 50;
        }
        .src-modal.open { display: flex; }
        .src-box { background: var(--wiki-panel); border: 1px solid var(--wiki-border); border-radius: 12px; width: 80vw; height: 80vh; display: flex; flex-direction: column; }
        .src-head { padding: 12px 16px; border-bottom: 1px solid var(--wiki-border); display: flex; justify-content: space-between; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
        .src-head button { background: #1d2433; color: var(--wiki-text); border: 1px solid var(--wiki-border); border-radius: 6px; padding: 4px 12px; cursor: pointer; }
        .src-body { overflow: auto; padding: 12px 16px; }
        .src-body pre { margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; line-height: 1.5; }
        .src-body .hl { background: rgba(124,156,255,.18); display: block; }
    </style>
</head>
<body>
    <div class="wiki-shell">
        <aside class="wiki-toc">
            <div class="wiki-brand">Arch<span>Wiki</span></div>
            <div class="wiki-ns" id="ns-label">loading…</div>
            <div id="toc"></div>
        </aside>
        <main class="wiki-content" id="content">
            <div class="placeholder spinner">Generating wiki… the first build runs the LLM per subsystem and may take a moment.</div>
        </main>
    </div>

    <div class="src-modal" id="src-modal">
        <div class="src-box">
            <div class="src-head">
                <span id="src-title"></span>
                <button onclick="closeSrc()">Close ✕</button>
            </div>
            <div class="src-body" id="src-body"></div>
        </div>
    </div>

    <script src="wiki.js"></script>
</body>
</html>
